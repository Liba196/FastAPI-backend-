<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POESSA Admin — Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/admin-styles.css">
</head>
<body>

  <div class="admin-login">
      <div class="admin-login__card admin-border-glow">
      <img src="logo.png" alt="POESSA Logo" class="admin-login__logo">
      <h1 class="admin-login__title">Admin Panel</h1>
      <p class="admin-login__subtitle">POESSA staff sign-in</p>

      <div class="admin-error" id="login-error"></div>

      <form id="login-form">
        <div class="admin-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="username">
        </div>
        <div class="admin-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="admin-btn" id="login-submit">Sign In</button>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>

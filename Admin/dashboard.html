<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POESSA Admin — Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../Frontend/css/styles.css">
<link rel="stylesheet" href="css/admin-styles.css">
</head>
<body>

  <div class="admin-shell">
    <header class="admin-topbar">
      <img src="logo.png" alt="POESSA Logo" class="admin-topbar__logo">
      <p class="admin-topbar__title">POESSA Admin</p>
      <span class="admin-topbar__user" id="topbar-user"></span>
      <button class="admin-topbar__logout" id="logout-btn">Log Out</button>
    </header>

    <nav class="admin-nav">
      <button class="admin-nav__tab is-active" data-tab="documents">Documents</button>
      <button class="admin-nav__tab" data-tab="users" id="users-tab">Users</button>
    </nav>

    <main class="admin-main">

      <section class="admin-section" id="documents-section">
        <div class="admin-panel">
          <h2 class="admin-panel__title">Upload Document</h2>
          <form id="upload-form" class="admin-upload-row">
            <div class="admin-field">
              <label for="doc-title">Title</label>
              <input type="text" id="doc-title" required>
            </div>
            <div class="admin-field">
              <label for="doc-file">PDF File</label>
              <input type="file" id="doc-file" accept="application/pdf" required>
            </div>
            <button type="submit" class="admin-btn" id="upload-submit">Upload</button>
          </form>
          <div class="admin-error" id="upload-error"></div>
        </div>

        <div class="admin-panel">
          <h2 class="admin-panel__title">Documents</h2>
          <table class="admin-table" id="documents-table">
            <thead>
              <tr><th>Title</th><th>File</th><th>Status</th><th></th></tr>
            </thead>
            <tbody id="documents-tbody"></tbody>
          </table>
          <div class="admin-empty" id="documents-empty" hidden>No documents yet.</div>
        </div>
      </section>

     <section class="admin-section" id="users-section" hidden>
  <div class="admin-panel">
    <h2 class="admin-panel__title">Create Staff Account</h2>
    <form id="create-user-form" class="admin-upload-row">
      <div class="admin-field">
        <label for="new-user-name">Full Name</label>
        <input type="text" id="new-user-name" required>
      </div>
      <div class="admin-field">
        <label for="new-user-email">Email</label>
        <input type="email" id="new-user-email" required>
      </div>
      <div class="admin-field">
        <label for="new-user-password">Password</label>
        <input type="password" id="new-user-password" required>
      </div>
      <div class="admin-field">
        <label for="new-user-role">Role</label>
        <select id="new-user-role">
          <option value="content_editor">content_editor</option>
          <option value="it_admin">it_admin</option>
          <option value="super_admin">super_admin</option>
        </select>
      </div>
      <button type="submit" class="admin-btn" id="create-user-submit">Create Account</button>
    </form>
    <div class="admin-error" id="create-user-error"></div>
  </div>

  <div class="admin-panel">
    <h2 class="admin-panel__title">Staff Accounts</h2>
    <table class="admin-table" id="users-table">
      <thead>
        <tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr>
      </thead>
      <tbody id="users-tbody"></tbody>
    </table>
    <div class="admin-empty" id="users-empty" hidden>No staff accounts yet.</div>
  </div>
</section>

    </main>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/document.js"></script>
  <script src="js/users.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
